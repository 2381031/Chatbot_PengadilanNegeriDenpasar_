<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chatbot Pengadilan Negeri Denpasar</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
}

.chat-toggle {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    border: none;
    background: #9b0000;
    color: white;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,.3);
    z-index: 9999;
}

.chat-toggle:hover {
    background: #b30000;
    transform: scale(1.05);
}

.chat-container {
    position: fixed;
    bottom: 100px;
    right: 25px;
    width: 420px;
    height: 650px;
    background: white;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 12px 35px rgba(0,0,0,.22);
    display: none;
    flex-direction: column;
    z-index: 9998;
}

.chat-header {
    background: #9b0000;
    color: white;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
}

.chat-header img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: white;
    padding: 5px;
}

.header-text h2 {
    font-size: 18px;
    line-height: 1.1;
}

.header-text p {
    font-size: 13px;
    opacity: .95;
}

#chatbox {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #f9fafb;
}

.message {
    margin-bottom: 13px;
    padding: 12px 15px;
    border-radius: 15px;
    max-width: 88%;
    line-height: 1.5;
    font-size: 14px;
    word-wrap: break-word;
}

.bot {
    background: #e5e7eb;
    color: #111827;
}

.user {
    background: #9b0000;
    color: white;
    margin-left: auto;
}

.questions-wrapper {
    border-top: 1px solid #ddd;
    background: #fff;
    padding: 10px 12px 12px;
}

.questions-title {
    font-size: 12px;
    color: #555;
    margin-bottom: 8px;
    font-weight: bold;
}

.questions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    max-height: 220px;
    overflow-y: auto;
    padding-right: 3px;
}

.question-btn {
    border: none;
    background: #9b0000;
    color: white;
    padding: 9px 8px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 12px;
    line-height: 1.25;
    min-height: 42px;
    text-align: center;
}

.question-btn:hover {
    background: #b30000;
}

.question-btn.other {
    background: #374151;
    grid-column: 1 / 3;
    font-weight: bold;
}

.question-btn.other:hover {
    background: #111827;
}

.chat-input-area {
    display: none;
    padding: 12px;
    gap: 8px;
    border-top: 1px solid #ddd;
    background: #fff;
}

.chat-input-area input {
    flex: 1;
    border: 1px solid #ccc;
    border-radius: 22px;
    padding: 11px 14px;
    outline: none;
    font-size: 13px;
}

.chat-input-area button {
    border: none;
    background: #9b0000;
    color: white;
    min-width: 43px;
    height: 43px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
}

#chatbox::-webkit-scrollbar,
.questions::-webkit-scrollbar {
    width: 5px;
}

#chatbox::-webkit-scrollbar-thumb,
.questions::-webkit-scrollbar-thumb {
    background: #c7c7c7;
    border-radius: 10px;
}

@media(max-width: 480px) {
    .chat-container {
        width: 100%;
        height: 100%;
        right: 0;
        bottom: 0;
        border-radius: 0;
    }

    .chat-toggle {
        width: 55px;
        height: 55px;
        right: 18px;
        bottom: 18px;
        font-size: 24px;
    }

    .questions {
        grid-template-columns: 1fr;
        max-height: 250px;
    }

    .question-btn.other {
        grid-column: auto;
    }

    .message {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<button class="chat-toggle" onclick="toggleChat()">
    <i class="fa-solid fa-comments"></i>
</button>

<div class="chat-container" id="chatContainer">

    <div class="chat-header">
        <img src="Logo.png" alt="Logo PN Denpasar">
        <div class="header-text">
            <h2>PN Denpasar</h2>
            <p>Pelayanan Informasi Online</p>
        </div>
    </div>

    <div id="chatbox">
        <div class="message bot">
            👋 Selamat datang di layanan chatbot Pengadilan Negeri Denpasar.
            <br><br>
            Silakan pilih pertanyaan yang tersedia di bawah. Jika pertanyaan belum tersedia, pilih <b>Lainnya</b> lalu ketik pertanyaan Anda.
        </div>
    </div>

    <div class="questions-wrapper">
        <div class="questions-title">Daftar Pertanyaan</div>

        <div class="questions" id="questionArea">
            <!-- Tombol pertanyaan otomatis muncul dari JavaScript -->
        </div>
    </div>

    <div class="chat-input-area" id="inputArea">
        <input
            type="text"
            id="userInput"
            placeholder="Tulis pertanyaan Anda di sini..."
            onkeydown="if(event.key === 'Enter') submitOtherQuestion()"
        >

        <button onclick="submitOtherQuestion()">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>

</div>

<script>
function getApiUrl() {
    if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
        return 'http://localhost:3000';
    }

    return '';
}

/*
  SEMUA PERTANYAAN DAN JAWABAN DIMASUKKAN DI INDEX
  Jadi tetap jalan walaupun API/database sedang error.
*/
const localFaqs = [
    {
        question: 'Apa jam pelayanan Pengadilan Negeri Denpasar?',
        answer: 'Dengan hormat, jam pelayanan Pengadilan Negeri Denpasar dilaksanakan pada hari kerja, yaitu Senin sampai Jumat sesuai jam operasional kantor. Untuk pelayanan PTSP, pengunjung dapat datang langsung ke meja pelayanan Pengadilan Negeri Denpasar.'
    },
    {
        question: 'Di mana alamat Pengadilan Negeri Denpasar?',
        answer: 'Dengan hormat, alamat kantor Pengadilan Negeri Denpasar dapat dicari melalui Google Maps dengan kata kunci Pengadilan Negeri Denpasar. Pengunjung juga dapat datang langsung ke kantor untuk mendapatkan layanan PTSP.'
    },
    {
        question: 'Bagaimana cara menghubungi Pengadilan Negeri Denpasar?',
        answer: 'Dengan hormat, untuk informasi kontak Pengadilan Negeri Denpasar, pengunjung dapat menghubungi layanan informasi resmi atau datang langsung ke meja PTSP Pengadilan Negeri Denpasar.'
    },
    {
        question: 'Bagaimana cara melihat jadwal sidang?',
        answer: 'Informasi jadwal sidang dapat dilihat melalui Sistem Informasi Penelusuran Perkara atau SIPP Pengadilan Negeri Denpasar. Pengunjung juga dapat menanyakan langsung kepada petugas PTSP.'
    },
    {
        question: 'Apa saja layanan hukum yang tersedia?',
        answer: 'Layanan hukum yang tersedia meliputi informasi perkara, surat keterangan, legalisasi surat, pendaftaran surat kuasa, layanan e-Court, serta layanan kepaniteraan lainnya sesuai ketentuan yang berlaku.'
    },
    {
        question: 'Apa itu layanan E-Court?',
        answer: 'Layanan e-Court adalah layanan peradilan secara elektronik yang meliputi pembuatan user dan password e-Court, pendaftaran permohonan, gugatan, gugatan sederhana, bantahan secara online, pendaftaran email advokat tergugat untuk persidangan online atau e-Litigasi, serta informasi lain terkait e-Court.'
    },
    {
        question: 'Bagaimana langkah-langkah membuat user E-Court?',
        answer: 'Langkah-langkah membuat user E-Court adalah: pertama, datang ke layanan e-Court atau PTSP Pengadilan Negeri Denpasar. Kedua, siapkan data atau dokumen yang diperlukan. Ketiga, petugas akan membantu proses pembuatan user dan password pada aplikasi e-Court sesuai ketentuan yang berlaku.'
    },
    {
        question: 'Bagaimana cara mendaftarkan perkara secara online?',
        answer: 'Pendaftaran perkara secara online dapat dilakukan melalui layanan e-Court. Jenis perkara yang dapat didaftarkan meliputi permohonan, gugatan, gugatan sederhana, dan bantahan sesuai ketentuan yang berlaku.'
    },
    {
        question: 'Apa saja layanan Sub Bagian Umum dan Keuangan?',
        answer: 'Layanan PTSP Sub Bagian Umum dan Keuangan menerima dan menyerahkan seluruh surat-surat yang ditujukan kepada Pengadilan Negeri Denpasar maupun surat-surat yang dikeluarkan oleh Pengadilan Negeri Denpasar.'
    },
    {
        question: 'Apa saja layanan Kepaniteraan Muda Tipikor?',
        answer: 'Layanan Kepaniteraan Muda Tipikor meliputi penerimaan pelimpahan berkas perkara Tipikor dari penuntut umum atau penyidik, permohonan perlawanan, banding, kasasi, peninjauan kembali dan grasi, memori atau kontra memori, pencabutan permohonan, pembantaran, izin besuk, izin atau persetujuan penyitaan, penggeledahan, perpanjangan penahanan secara online, serta informasi penyelesaian perkara Tipikor.'
    },
    {
        question: 'Bagaimana proses pelimpahan berkas perkara Tipikor?',
        answer: 'Pelimpahan berkas perkara Tipikor dari penuntut umum atau penyidik dilayani melalui Kepaniteraan Muda Tipikor Pengadilan Negeri Denpasar sesuai prosedur yang berlaku.'
    },
    {
        question: 'Bagaimana cara mengajukan izin besuk perkara Tipikor?',
        answer: 'Permohonan izin besuk untuk perkara Tipikor dapat diajukan melalui Kepaniteraan Muda Tipikor dengan mengikuti prosedur dan persyaratan yang berlaku.'
    },
    {
        question: 'Apa itu layanan PHI?',
        answer: 'Layanan PHI adalah layanan Kepaniteraan Muda PHI yang menerima pendaftaran perkara gugatan PHI dan upaya hukum perkara PHI, serta menerima pendaftaran surat kuasa khusus maupun kuasa insidentil untuk perkara PHI.'
    },
    {
        question: 'Bagaimana cara mendaftarkan gugatan PHI?',
        answer: 'Pendaftaran perkara gugatan PHI dan upaya hukum perkara PHI dapat dilakukan melalui layanan Kepaniteraan Muda PHI Pengadilan Negeri Denpasar sesuai prosedur yang berlaku.'
    },
    {
        question: 'Bagaimana cara mendaftarkan surat kuasa PHI?',
        answer: 'Pendaftaran surat kuasa khusus maupun kuasa insidentil untuk perkara PHI dilayani melalui Kepaniteraan Muda PHI dengan membawa dokumen yang diperlukan.'
    },
    {
        question: 'Apa saja layanan Kepaniteraan Muda Hukum?',
        answer: 'Layanan Kepaniteraan Muda Hukum meliputi permohonan waarmerking surat-surat, pembuatan surat keterangan tidak tersangkut perkara pidana dan perdata, permohonan surat izin riset, permohonan keterangan data perkara, turunan putusan perkara yang telah berkekuatan hukum tetap, pendaftaran surat kuasa, legalisasi surat, serta layanan lain yang berhubungan dengan pelayanan kepaniteraan hukum.'
    },
    {
        question: 'Bagaimana cara mengajukan waarmerking surat?',
        answer: 'Permohonan waarmerking surat-surat dapat diajukan melalui Kepaniteraan Muda Hukum Pengadilan Negeri Denpasar sesuai prosedur dan persyaratan yang berlaku.'
    },
    {
        question: 'Bagaimana cara membuat surat keterangan tidak tersangkut perkara?',
        answer: 'Pembuatan surat keterangan tidak tersangkut perkara pidana dan perdata dapat diajukan melalui Kepaniteraan Muda Hukum dengan membawa persyaratan yang diperlukan.'
    },
    {
        question: 'Bagaimana cara mengajukan izin riset?',
        answer: 'Permohonan surat izin riset dapat diajukan melalui Kepaniteraan Muda Hukum Pengadilan Negeri Denpasar dengan membawa dokumen atau persyaratan yang diperlukan.'
    },
    {
        question: 'Bagaimana cara mengajukan legalisasi surat?',
        answer: 'Permohonan legalisasi surat dapat dilayani melalui Kepaniteraan Muda Hukum Pengadilan Negeri Denpasar sesuai prosedur dan persyaratan yang berlaku.'
    },
    {
        question: 'Kenapa perlu menggunakan layanan E-Court?',
        answer: 'Layanan E-Court digunakan untuk mempermudah proses pendaftaran perkara secara elektronik sehingga pengguna dapat melakukan pendaftaran permohonan, gugatan, gugatan sederhana, dan bantahan secara online sesuai ketentuan yang berlaku.'
    },
    {
        question: 'Kenapa perlu datang ke PTSP?',
        answer: 'PTSP atau Pelayanan Terpadu Satu Pintu membantu pengunjung mendapatkan layanan dan informasi secara lebih terarah, mulai dari layanan kepaniteraan, hukum, e-Court, hingga informasi perkara.'
    },
    {
        question: 'Kenapa surat keterangan harus diajukan melalui Kepaniteraan Muda Hukum?',
        answer: 'Surat keterangan seperti keterangan tidak tersangkut perkara pidana dan perdata diproses melalui Kepaniteraan Muda Hukum karena bagian tersebut menangani layanan administrasi hukum sesuai kewenangannya.'
    }
];

function toggleChat() {
    const chat = document.getElementById('chatContainer');

    if (chat.style.display === 'flex') {
        chat.style.display = 'none';
    } else {
        chat.style.display = 'flex';
    }
}

function escapeHtml(text) {
    return String(text).replace(/[&<>'"]/g, function(c) {
        return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        }[c];
    });
}

function addMessage(type, text) {
    const chatbox = document.getElementById('chatbox');

    chatbox.innerHTML += `
        <div class="message ${type}">
            ${escapeHtml(text).replace(/\n/g, '<br>')}
        </div>
    `;

    chatbox.scrollTop = chatbox.scrollHeight;
}

function shortButtonText(question) {
    if (question.length > 45) {
        return question.substring(0, 45) + '...';
    }

    return question;
}

function renderQuestionButtons(faqs) {
    const questionArea = document.getElementById('questionArea');
    questionArea.innerHTML = '';

    faqs.forEach(item => {
        const button = document.createElement('button');

        button.className = 'question-btn';
        button.textContent = shortButtonText(item.question);
        button.title = item.question;

        button.onclick = function() {
            sendQuestion(item.question);
        };

        questionArea.appendChild(button);
    });

    const otherButton = document.createElement('button');
    otherButton.className = 'question-btn other';
    otherButton.textContent = 'Lainnya';
    otherButton.onclick = showOtherQuestion;

    questionArea.appendChild(otherButton);
}

async function loadQuestions() {
    /*
      Coba ambil dari database.
      Kalau gagal, pakai localFaqs yang sudah ada di index.
    */
    try {
        const API_URL = getApiUrl();

        const response = await fetch(`${API_URL}/api/faqs`);
        const result = await response.json();

        if (!response.ok || !result.success || !Array.isArray(result.data)) {
            throw new Error('Gagal mengambil dari database');
        }

        const dbFaqs = result.data.map(item => {
            return {
                question: item.question,
                answer: ''
            };
        });

        renderQuestionButtons(dbFaqs);

    } catch (error) {
        console.log('Memakai pertanyaan lokal dari index.html');
        renderQuestionButtons(localFaqs);
    }
}

function findLocalAnswer(question) {
    const selected = localFaqs.find(item => {
        return item.question.toLowerCase() === question.toLowerCase();
    });

    if (selected) {
        return selected.answer;
    }

    const similar = localFaqs.find(item => {
        return item.question.toLowerCase().includes(question.toLowerCase()) ||
               question.toLowerCase().includes(item.question.toLowerCase());
    });

    if (similar) {
        return similar.answer;
    }

    return null;
}

function showOtherQuestion() {
    addMessage('user', 'Lainnya');

    setTimeout(() => {
        addMessage(
            'bot',
            'Silakan ajukan pertanyaan Anda melalui kolom chat di bawah. Pertanyaan akan tersimpan dan menunggu jawaban petugas.'
        );

        document.getElementById('inputArea').style.display = 'flex';
        document.getElementById('userInput').focus();
    }, 300);
}

async function submitOtherQuestion() {
    const input = document.getElementById('userInput');
    const question = input.value.trim();

    if (question === '') {
        return;
    }

    addMessage('user', question);
    input.value = '';

    /*
      Coba simpan ke database.
      Kalau server belum aktif, tetap tampilkan pesan menunggu.
    */
    try {
        const API_URL = getApiUrl();

        const response = await fetch(`${API_URL}/api/pertanyaan-lainnya`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ question: question })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error('Gagal simpan ke database');
        }

        addMessage(
            'bot',
            'Pertanyaan Anda sudah tersimpan. Mohon tunggu, pertanyaan akan segera kami jawab. Terima kasih.'
        );

    } catch (error) {
        addMessage(
            'bot',
            'Pertanyaan Anda sudah diterima. Jika server database belum aktif, silakan hubungi petugas PTSP untuk memastikan pertanyaan tersimpan.'
        );
    }
}

async function sendQuestion(question) {
    addMessage('user', question);

    /*
      Coba jawab dari server/database.
      Kalau gagal, jawab dari localFaqs di index.
    */
    try {
        const API_URL = getApiUrl();

        const response = await fetch(`${API_URL}/api/chat?q=${encodeURIComponent(question)}`);
        const data = await response.json();

        if (!response.ok || !data.reply) {
            throw new Error('Gagal ambil jawaban server');
        }

        addMessage('bot', data.reply);

    } catch (error) {
        const localAnswer = findLocalAnswer(question);

        if (localAnswer) {
            addMessage('bot', localAnswer);
        } else {
            addMessage(
                'bot',
                'Maaf, jawaban untuk pertanyaan tersebut belum tersedia. Silakan pilih menu Lainnya untuk mengajukan pertanyaan kepada petugas.'
            );
        }
    }
}

document.addEventListener('DOMContentLoaded', loadQuestions);
</script>

</body>
</html>
