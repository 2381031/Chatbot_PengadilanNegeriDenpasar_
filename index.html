<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chatbot Pengadilan Negeri Denpasar</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
}

/* Tombol buka chatbot */
.chat-toggle {
    position: fixed;
    right: env(safe-area-inset-right, clamp(16px, 3vw, 28px));
    bottom: env(safe-area-inset-bottom, clamp(16px, 3vw, 28px));
    width: clamp(64px, 10vw, 84px);
    height: clamp(64px, 10vw, 84px);
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    box-shadow: 0 12px 28px rgba(0,0,0,.18);
    z-index: 10011 !important;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .2s ease, box-shadow .2s ease;
    overflow: hidden;
    aspect-ratio: 1 / 1;
}

.chat-toggle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.chat-toggle:hover {
    transform: scale(1.05);
    box-shadow: 0 14px 32px rgba(0,0,0,.28);
}

.chat-close {
    position: absolute;
    right: 14px;
    top: 14px;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,.16);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: background .2s ease, transform .2s ease;
}

.chat-close:hover {
    background: rgba(255,255,255,.28);
    transform: scale(1.05);
}

/* Container utama chatbot */
.chat-container {
    position: fixed;
    right: clamp(16px, 3vw, 28px);
    bottom: clamp(92px, 12vh, 110px);
    width: min(430px, calc(100vw - 32px));
    height: min(650px, calc(100dvh - 125px));
    background: white;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 14px 40px rgba(0,0,0,.25);
    display: none;
    flex-direction: column;
    z-index: 10009;
}

/* Header */
.chat-header {
    position: relative;
    background: #9b0000;
    color: white;
    padding: clamp(13px, 2vw, 18px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 13px;
    flex-shrink: 0;
}

.chat-header-left {
    display: flex;
    align-items: center;
    gap: 13px;
    min-width: 0;
    flex: 1;
}

.chat-header img {
    width: clamp(42px, 6vw, 52px);
    height: clamp(42px, 6vw, 52px);
    border-radius: 50%;
    background: white;
    padding: 5px;
    object-fit: contain;
    flex-shrink: 0;
}

.header-text {
    min-width: 0;
}

.header-text h2 {
    font-size: clamp(15px, 2.2vw, 18px);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.header-text p {
    font-size: clamp(11px, 1.8vw, 13px);
    opacity: .95;
    margin-top: 3px;
}

/* Area chat */
#chatbox {
    flex: 1;
    padding: clamp(12px, 2vw, 15px);
    overflow-y: auto;
    background: #f9fafb;
    min-height: 0;
}

.message {
    margin-bottom: 13px;
    padding: clamp(10px, 2vw, 12px) clamp(12px, 2vw, 15px);
    border-radius: 15px;
    max-width: 88%;
    line-height: 1.5;
    font-size: clamp(13px, 1.8vw, 14px);
    word-wrap: break-word;
    overflow-wrap: anywhere;
    white-space: normal;
}

.bot {
    background: #e5e7eb;
    color: #111827;
    border-bottom-left-radius: 5px;
}

.user {
    background: #9b0000;
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 5px;
}

/* Pertanyaan */
.questions-wrapper {
    border-top: 1px solid #ddd;
    background: #fff;
    padding: 10px 12px 12px;
    flex-shrink: 0;
}

.questions-title {
    font-size: clamp(11px, 1.7vw, 12px);
    color: #555;
    margin-bottom: 8px;
    font-weight: bold;
}

.questions {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    grid-auto-rows: minmax(min-content, auto);
    align-items: stretch;
    gap: 10px;
    max-height: clamp(155px, 28vh, 260px);
    overflow-y: auto;
    padding-right: 2px;
}

.question-btn {
    border: none;
    background: #9b0000;
    color: white;
    padding: 12px 14px;
    border-radius: 14px;
    cursor: pointer;
    font-size: clamp(12px, 1.7vw, 13px);
    line-height: 1.4;
    min-height: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    word-break: break-word;
    white-space: normal;
    transition: background .2s ease, transform .2s ease;
}

.question-btn:hover {
    background: #b30000;
}

.question-btn.other {
    background: #374151;
    grid-column: 1 / -1;
    font-weight: bold;
}

.question-btn.other:hover {
    background: #111827;
}

/* Input pertanyaan lainnya */
.chat-input-area {
    display: none;
    padding: 12px;
    gap: 8px;
    border-top: 1px solid #ddd;
    background: #fff;
    flex-shrink: 0;
}

.chat-input-area input {
    flex: 1;
    min-width: 0;
    border: 1px solid #ccc;
    border-radius: 22px;
    padding: 11px 14px;
    outline: none;
    font-size: clamp(12px, 1.8vw, 13px);
}

.chat-input-area button {
    border: none;
    background: #9b0000;
    color: white;
    min-width: 43px;
    width: 43px;
    height: 43px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
    flex-shrink: 0;
}

.chat-input-area button:hover {
    background: #b30000;
}

.loading-text {
    color: #666;
    font-size: 13px;
    padding: 10px;
    text-align: center;
    grid-column: 1 / -1;
}

/* Scrollbar */
#chatbox::-webkit-scrollbar,
.questions::-webkit-scrollbar {
    width: 5px;
}

#chatbox::-webkit-scrollbar-thumb,
.questions::-webkit-scrollbar-thumb {
    background: #c7c7c7;
    border-radius: 10px;
}

/* Tablet */
@media (min-width: 481px) and (max-width: 900px) {
    .chat-container {
        width: min(520px, calc(100vw - 36px));
        height: min(720px, calc(100dvh - 120px));
        right: 18px;
        bottom: 95px;
    }

    .questions {
        grid-template-columns: repeat(2, minmax(180px, 1fr));
        max-height: 250px;
    }
}

@media (min-width: 901px) and (max-width: 1199px) {
    .chat-container {
        width: min(620px, calc(100vw - 40px));
        height: min(760px, calc(100dvh - 100px));
        right: 24px;
        bottom: 96px;
    }

    .questions {
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        max-height: 280px;
    }
}

/* HP */
@media (max-width: 480px) {
    .chat-container {
        width: 100vw;
        height: 100dvh;
        right: 0;
        bottom: 0;
        border-radius: 0;
    }

    .chat-toggle {
        width: 60px;
        height: 60px;
        right: 16px;
        bottom: 16px;
        font-size: 23px;
    }

    .chat-header {
        padding: 14px;
    }

    #chatbox {
        padding: 12px;
    }

    .message {
        max-width: 92%;
        font-size: 13px;
    }

    .questions-wrapper {
        padding: 9px 10px 10px;
    }

    .questions {
        grid-template-columns: 1fr;
        max-height: 210px;
    }

    .question-btn {
        font-size: 12px;
        min-height: 44px;
        padding: 10px 12px;
    }

    .question-btn.other {
        grid-column: 1 / -1;
    }

    .chat-input-area {
        padding: 10px;
    }

    .chat-input-area input {
        font-size: 13px;
    }
}

/* HP kecil */
@media (max-width: 360px) {
    .chat-header img {
        width: 40px;
        height: 40px;
    }

    .header-text h2 {
        font-size: 14px;
    }

    .header-text p {
        font-size: 11px;
    }

    .questions {
        max-height: 180px;
    }

    .question-btn {
        font-size: 11px;
        padding: 8px;
    }
}

/* Laptop / layar besar */
@media (min-width: 1200px) {
    .chat-container {
        width: 440px;
        height: 670px;
    }
}

/* Mode embed: dipakai saat halaman dimuat di dalam iframe widget eksternal */
html.embed-mode,
html.embed-mode body {
    width: 100%;
    height: 100%;
    min-height: 100%;
    overflow: hidden;
}

html.embed-mode .chat-toggle {
    display: none !important;
}

html.embed-mode .chat-container {
    display: flex !important;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    right: auto;
    bottom: auto;
    border-radius: 0;
    box-shadow: none;
    z-index: 1;
}

html.embed-mode .chat-header {
    display: none;
}
</style>
<script>
(function () {
    var isEmbed = window.self !== window.top || new URLSearchParams(location.search).has('bot');
    if (isEmbed) {
        document.documentElement.classList.add('embed-mode');
    }
})();
</script>
</head>

<body>

<button class="chat-toggle" onclick="toggleChat()" id="chatToggle" aria-label="Buka chatbot">
    <img src="/PandePintar.png" alt="Logo Pande Pintar">
</button>

<div class="chat-container" id="chatContainer">

    <div class="chat-header">
        <div class="chat-header-left">
            <img src="/Logo.png" alt="Logo PN Denpasar">
            <div class="header-text">
                <h2>PN Denpasar</h2>
                <p>Pelayanan Informasi Online</p>
            </div>
        </div>
        <button class="chat-close" onclick="toggleChat()" aria-label="Tutup chatbot">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <div id="chatbox">
        <div class="message bot">
            👋 Selamat datang di layanan PANDE PINTAR Pengadilan Negeri Denpasar.
            <br><br>
            Silakan pilih pertanyaan yang tersedia di bawah. Jika pertanyaan belum tersedia, pilih <b>Lainnya</b> lalu ketik pertanyaan Anda.
        </div>
    </div>

    <div class="questions-wrapper">
        <div class="questions-title" id="questionTitle">Daftar Pertanyaan</div>
        <div class="questions" id="questionArea">
            <div class="loading-text">Memuat pertanyaan...</div>
        </div>
    </div>

    <div class="chat-input-area" id="inputArea">
        <input
            type="text"
            id="userInput"
            placeholder="Tulis pertanyaan Anda di sini..."
            onkeydown="if(event.key === 'Enter') submitOtherQuestion()"
        >

        <button onclick="submitOtherQuestion()">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>

</div>

<script>
function getApiUrl() {
    if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
        return 'http://localhost:3000';
    }
    return '';
}

let faqs = [];

function toggleChat() {
    const chat = document.getElementById('chatContainer');
    const toggle = document.getElementById('chatToggle');
    const isOpen = window.getComputedStyle(chat).display === 'flex';

    if (isOpen) {
        chat.style.display = 'none';
        if (toggle) {
            toggle.style.display = 'flex';
        }
    } else {
        chat.style.display = 'flex';
        if (toggle) {
            toggle.style.display = 'none';
        }
    }
}

function escapeHtml(text) {
    return String(text).replace(/[&<>'"]/g, function(c) {
        return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        }[c];
    });
}

function addMessage(type, text) {
    const chatbox = document.getElementById('chatbox');

    const message = document.createElement('div');
    message.className = `message ${type}`;
    message.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');

    chatbox.appendChild(message);
    chatbox.scrollTop = chatbox.scrollHeight;
}

function cleanText(value = '') {
    return String(value)
        .toLowerCase()
        .trim()
        .replace(/[\u2018\u2019']/g, '')
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ');
}

function shortButtonText(question) {
    return String(question || '');
}

function normalizeFaq(item) {
    const id = item.id ?? item.id_serial ?? item.no ?? '';
    const question = item.question ?? item.question_text ?? item.pertanyaan ?? item.text_question ?? '';
    const answer = item.answer ?? item.answer_text ?? item.jawaban ?? item.text_answer ?? '';

    return {
        id: id === null || id === undefined ? '' : String(id).trim(),
        question: String(question || '').trim(),
        answer: String(answer || '').trim()
    };
}

function sortFaqs(list) {
    return list.slice().sort((a, b) => {
        const aId = Number(a.id);
        const bId = Number(b.id);

        if (!Number.isNaN(aId) && !Number.isNaN(bId)) {
            return aId - bId;
        }

        return String(a.id).localeCompare(String(b.id));
    });
}

function renderQuestionButtons() {
    const questionArea = document.getElementById('questionArea');
    const questionTitle = document.getElementById('questionTitle');
    questionArea.innerHTML = '';

    if (!faqs || faqs.length === 0) {
        questionTitle.textContent = 'Daftar Pertanyaan';
        questionArea.innerHTML = `
            <div class="loading-text">
                Pertanyaan belum tersedia.
            </div>
        `;
        return;
    }

    questionTitle.textContent = `Daftar Pertanyaan (${faqs.length})`;

    faqs.forEach(item => {
        const button = document.createElement('button');
        button.className = 'question-btn';

        const label = item.id ? `${item.id}. ${shortButtonText(item.question)}` : shortButtonText(item.question);
        button.textContent = label;
        button.title = item.question;

        button.onclick = function() {
            sendQuestion(item.question);
        };

        questionArea.appendChild(button);
    });

    const otherButton = document.createElement('button');
    otherButton.className = 'question-btn other';
    otherButton.textContent = 'Lainnya';
    otherButton.onclick = showOtherQuestion;

    questionArea.appendChild(otherButton);
}

async function loadQuestions() {
    const questionArea = document.getElementById('questionArea');
    const questionTitle = document.getElementById('questionTitle');

    questionArea.innerHTML = `
        <div class="loading-text">
            Memuat pertanyaan...
        </div>
    `;
    questionTitle.textContent = 'Daftar Pertanyaan';

    try {
        const API_URL = getApiUrl();

        const response = await fetch(`${API_URL}/api/faqs?t=${Date.now()}`, {
            method: 'GET',
            cache: 'no-store',
            headers: {
                'Cache-Control': 'no-cache'
            }
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.detail || 'Gagal mengambil data FAQ');
        }

        let rawData = [];
        if (result && result.success && Array.isArray(result.data)) {
            rawData = result.data;
        } else if (Array.isArray(result)) {
            rawData = result;
        } else {
            throw new Error('Format data FAQ tidak sesuai');
        }

        faqs = sortFaqs(rawData.map(normalizeFaq).filter(item => item.question && item.answer));

        renderQuestionButtons();

    } catch (error) {
        console.error('Gagal mengambil pertanyaan dari database:', error);

        questionArea.innerHTML = `
            <div class="loading-text">
                Gagal memuat pertanyaan dari database.
                <br>
                Periksa koneksi API /api/faqs.
            </div>
        `;

        addMessage(
            'bot',
            'Maaf, daftar pertanyaan belum dapat dimuat dari database. Silakan periksa koneksi server atau database.'
        );
    }
}

function showOtherQuestion() {
    addMessage('user', 'Lainnya');

    setTimeout(() => {
        addMessage(
            'bot',
            'Silakan ajukan pertanyaan Anda melalui kolom chat di bawah. Pertanyaan akan tersimpan dan menunggu jawaban petugas.'
        );

        document.getElementById('inputArea').style.display = 'flex';
        document.getElementById('userInput').focus();
    }, 300);
}

async function submitOtherQuestion() {
    const input = document.getElementById('userInput');
    const question = input.value.trim();

    if (question === '') {
        return;
    }

    addMessage('user', question);
    input.value = '';

    try {
        const API_URL = getApiUrl();

        const response = await fetch(`${API_URL}/api/pertanyaan-lainnya`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Cache-Control': 'no-cache'
            },
            body: JSON.stringify({ question: question })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.detail || 'Gagal menyimpan pertanyaan');
        }

        addMessage(
            'bot',
            'Pertanyaan Anda sudah tersimpan. Mohon tunggu, pertanyaan akan segera dijawab oleh petugas. Terima kasih.'
        );

    } catch (error) {
        console.error('Gagal menyimpan pertanyaan:', error);

        addMessage(
            'bot',
            'Maaf, pertanyaan belum dapat disimpan karena server atau database sedang bermasalah. Silakan coba lagi nanti atau hubungi petugas PTSP.'
        );
    }
}

async function sendQuestion(question) {
    addMessage('user', question);

    try {
        const API_URL = getApiUrl();

        const response = await fetch(`${API_URL}/api/chat?q=${encodeURIComponent(question)}&t=${Date.now()}`, {
            method: 'GET',
            cache: 'no-store',
            headers: {
                'Cache-Control': 'no-cache'
            }
        });

        const data = await response.json();

        if (!response.ok || !data.reply) {
            throw new Error(data.detail || 'Jawaban tidak ditemukan');
        }

        addMessage('bot', data.reply);

    } catch (error) {
        console.error('Gagal mengambil jawaban dari database:', error);

        addMessage(
            'bot',
            'Maaf, jawaban belum dapat diambil dari database. Silakan periksa koneksi server atau pilih menu Lainnya untuk mengajukan pertanyaan.'
        );
    }
}

window.addEventListener('resize', function() {
    renderQuestionButtons();
});

document.addEventListener('DOMContentLoaded', loadQuestions);
</script>

</body>
</html>
