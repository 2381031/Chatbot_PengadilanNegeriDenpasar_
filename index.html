<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chatbot Pengadilan Negeri Denpasar</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
}

.chat-toggle {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    border: none;
    background: #9b0000;
    color: white;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,.3);
    z-index: 9999;
}

.chat-toggle:hover {
    background: #b30000;
    transform: scale(1.05);
}

.chat-container {
    position: fixed;
    bottom: 100px;
    right: 25px;
    width: 410px;
    height: 640px;
    background: white;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 12px 35px rgba(0,0,0,.22);
    display: none;
    flex-direction: column;
    z-index: 9998;
}

.chat-header {
    background: #9b0000;
    color: white;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
}

.chat-header img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: white;
    padding: 5px;
}

.header-text h2 {
    font-size: 18px;
    line-height: 1.1;
}

.header-text p {
    font-size: 13px;
    opacity: .95;
}

#chatbox {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #f9fafb;
}

.message {
    margin-bottom: 13px;
    padding: 12px 15px;
    border-radius: 15px;
    max-width: 88%;
    line-height: 1.5;
    font-size: 14px;
    word-wrap: break-word;
}

.bot {
    background: #e5e7eb;
    color: #111827;
}

.user {
    background: #9b0000;
    color: white;
    margin-left: auto;
}

.questions-wrapper {
    border-top: 1px solid #ddd;
    background: #fff;
    padding: 10px 12px 12px;
}

.questions-title {
    font-size: 12px;
    color: #555;
    margin-bottom: 8px;
    font-weight: bold;
}

.questions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    max-height: 210px;
    overflow-y: auto;
    padding-right: 3px;
}

.question-btn {
    border: none;
    background: #9b0000;
    color: white;
    padding: 9px 8px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 12px;
    line-height: 1.25;
    min-height: 40px;
    text-align: center;
}

.question-btn:hover {
    background: #b30000;
}

.question-btn.other {
    background: #374151;
    grid-column: 1 / 3;
    font-weight: bold;
}

.question-btn.other:hover {
    background: #111827;
}

.chat-input-area {
    display: none;
    padding: 12px;
    gap: 8px;
    border-top: 1px solid #ddd;
    background: #fff;
}

.chat-input-area input {
    flex: 1;
    border: 1px solid #ccc;
    border-radius: 22px;
    padding: 11px 14px;
    outline: none;
    font-size: 13px;
}

.chat-input-area button {
    border: none;
    background: #9b0000;
    color: white;
    min-width: 43px;
    height: 43px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
}

#chatbox::-webkit-scrollbar,
.questions::-webkit-scrollbar {
    width: 5px;
}

#chatbox::-webkit-scrollbar-thumb,
.questions::-webkit-scrollbar-thumb {
    background: #c7c7c7;
    border-radius: 10px;
}

@media(max-width: 480px) {
    .chat-container {
        width: 100%;
        height: 100%;
        right: 0;
        bottom: 0;
        border-radius: 0;
    }

    .chat-toggle {
        width: 55px;
        height: 55px;
        right: 18px;
        bottom: 18px;
        font-size: 24px;
    }

    .questions {
        grid-template-columns: 1fr;
        max-height: 230px;
    }

    .question-btn.other {
        grid-column: auto;
    }

    .message {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<button class="chat-toggle" onclick="toggleChat()">
    <i class="fa-solid fa-comments"></i>
</button>

<div class="chat-container" id="chatContainer">

    <div class="chat-header">
        <img src="Logo.png" alt="Logo PN Denpasar">
        <div class="header-text">
            <h2>PN Denpasar</h2>
            <p>Pelayanan Informasi Online</p>
        </div>
    </div>

    <div id="chatbox">
        <div class="message bot">
            👋 Selamat datang di layanan chatbot Pengadilan Negeri Denpasar.
            <br><br>
            Silakan pilih pertanyaan yang tersedia di bawah. Jika pertanyaan belum tersedia, pilih <b>Lainnya</b> lalu ketik pertanyaan Anda.
        </div>
    </div>

    <div class="questions-wrapper">
        <div class="questions-title">Daftar Pertanyaan</div>

        <div class="questions" id="questionArea">
            <button class="question-btn other" onclick="showOtherQuestion()">
                Lainnya
            </button>
        </div>
    </div>

    <div class="chat-input-area" id="inputArea">
        <input
            type="text"
            id="userInput"
            placeholder="Tulis pertanyaan Anda di sini..."
            onkeydown="if(event.key === 'Enter') submitOtherQuestion()"
        >

        <button onclick="submitOtherQuestion()">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>

</div>

<script>
function getApiUrl() {
    if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
        return 'http://localhost:3000';
    }

    return '';
}

function toggleChat() {
    const chat = document.getElementById('chatContainer');

    if (chat.style.display === 'flex') {
        chat.style.display = 'none';
    } else {
        chat.style.display = 'flex';
    }
}

function escapeHtml(text) {
    return String(text).replace(/[&<>'"]/g, function(c) {
        return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        }[c];
    });
}

function addMessage(type, text) {
    const chatbox = document.getElementById('chatbox');

    chatbox.innerHTML += `
        <div class="message ${type}">
            ${escapeHtml(text).replace(/\n/g, '<br>')}
        </div>
    `;

    chatbox.scrollTop = chatbox.scrollHeight;
}

function getShortLabel(question) {
    const labels = {
        'jam pelayanan': 'Jam Pelayanan',
        'alamat kantor': 'Alamat Kantor',
        'kontak': 'Kontak',
        'jadwal sidang': 'Jadwal Sidang',
        'layanan hukum': 'Layanan Hukum',

        'layanan e-court': 'E-Court',
        'buat user e-court': 'User E-Court',
        'daftar perkara online': 'Daftar Online',
        'pendaftaran perkara online': 'Daftar Online',

        'layanan umum dan keuangan': 'Umum & Keuangan',

        'layanan tipikor': 'Tipikor',
        'pelimpahan berkas tipikor': 'Berkas Tipikor',
        'izin besuk tipikor': 'Izin Besuk',
        'izin besuk tahanan': 'Izin Besuk',

        'layanan phi': 'PHI',
        'pendaftaran gugatan phi': 'Gugatan PHI',
        'surat kuasa phi': 'Surat Kuasa PHI',

        'layanan kepaniteraan hukum': 'Kepaniteraan Hukum',
        'waarmerking surat': 'Waarmerking',
        'surat keterangan tidak tersangkut perkara': 'Surat Keterangan',
        'permohonan surat keterangan': 'Surat Keterangan',
        'izin riset': 'Izin Riset',
        'legalisasi surat': 'Legalisasi Surat'
    };

    return labels[String(question).toLowerCase()] || question;
}

const fallbackQuestions = [
    'jam pelayanan',
    'alamat kantor',
    'kontak',
    'jadwal sidang',
    'layanan hukum',
    'layanan e-court',
    'buat user e-court',
    'daftar perkara online',
    'layanan umum dan keuangan',
    'layanan tipikor',
    'pelimpahan berkas tipikor',
    'izin besuk tipikor',
    'layanan phi',
    'pendaftaran gugatan phi',
    'surat kuasa phi',
    'layanan kepaniteraan hukum',
    'waarmerking surat',
    'surat keterangan tidak tersangkut perkara',
    'izin riset',
    'legalisasi surat'
];

function renderQuestionButtons(questions) {
    const questionArea = document.getElementById('questionArea');

    questionArea.innerHTML = '';

    questions.forEach(question => {
        const button = document.createElement('button');

        button.className = 'question-btn';
        button.textContent = getShortLabel(question);
        button.title = question;

        button.onclick = function() {
            sendQuestion(question);
        };

        questionArea.appendChild(button);
    });

    const otherButton = document.createElement('button');

    otherButton.className = 'question-btn other';
    otherButton.textContent = 'Lainnya';
    otherButton.onclick = showOtherQuestion;

    questionArea.appendChild(otherButton);
}

async function loadQuestionsFromDatabase() {
    try {
        const API_URL = getApiUrl();

        const response = await fetch(`${API_URL}/api/faqs`);
        const result = await response.json();

        if (!response.ok || !result.success || !Array.isArray(result.data)) {
            throw new Error(result.error || 'Gagal mengambil daftar pertanyaan');
        }

        const questions = result.data.map(item => item.question);

        renderQuestionButtons(questions);

    } catch (error) {
        console.error('Gagal ambil pertanyaan dari database, pakai fallback:', error);

        renderQuestionButtons(fallbackQuestions);
    }
}

function showOtherQuestion() {
    addMessage('user', 'Lainnya');

    setTimeout(() => {
        addMessage(
            'bot',
            'Silakan ajukan pertanyaan Anda melalui kolom chat di bawah. Pertanyaan akan tersimpan dan menunggu jawaban petugas.'
        );

        document.getElementById('inputArea').style.display = 'flex';
        document.getElementById('userInput').focus();
    }, 300);
}

async function submitOtherQuestion() {
    const input = document.getElementById('userInput');
    const question = input.value.trim();

    if (question === '') {
        return;
    }

    addMessage('user', question);
    input.value = '';

    try {
        const API_URL = getApiUrl();

        const response = await fetch(`${API_URL}/api/pertanyaan-lainnya`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ question: question })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || 'Gagal menyimpan pertanyaan');
        }

        addMessage(
            'bot',
            'Pertanyaan Anda sudah tersimpan. Mohon tunggu, pertanyaan akan segera kami jawab. Terima kasih.'
        );

    } catch (error) {
        console.error(error);

        addMessage(
            'bot',
            'Maaf, pertanyaan belum dapat disimpan karena server sedang bermasalah. Silakan coba kembali.'
        );
    }
}

async function sendQuestion(question) {
    addMessage('user', getShortLabel(question));

    try {
        const API_URL = getApiUrl();

        const response = await fetch(`${API_URL}/api/chat?q=${encodeURIComponent(question)}`);
        const data = await response.json();

        addMessage(
            'bot',
            data.reply || 'Maaf, jawaban belum tersedia. Pilih Lainnya untuk mengajukan pertanyaan.'
        );

    } catch (error) {
        console.error(error);

        addMessage(
            'bot',
            'Maaf, server sedang tidak dapat dihubungkan.'
        );
    }
}

document.addEventListener('DOMContentLoaded', loadQuestionsFromDatabase);
</script>

</body>
</html>
